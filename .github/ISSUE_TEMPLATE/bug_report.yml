name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send an audio file with ...
        2. Press ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: tonearm doctor
      description: Paste the output. It contains no secrets.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        For a metadata bug, attach the file or its first few kilobytes — that is
        usually the whole diagnosis. For a crash, include the traceback from
        tonearm.log.
